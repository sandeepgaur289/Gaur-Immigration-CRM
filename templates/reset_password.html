<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaur Portal | Set New Password</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Times New Roman",serif;background:#020914;color:#fff}
body{
  min-height:100vh;
  background:
    linear-gradient(rgba(0,8,18,.28),rgba(0,8,18,.54)),
    url("{{ url_for('static',filename='gaur_portal_bg.png') }}") center/cover fixed no-repeat;
}
.overlay{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;position:relative}
.overlay:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,transparent 0 20%,rgba(0,7,16,.30) 62%,rgba(0,4,10,.72) 100%)}
.portal{position:relative;z-index:2;width:min(520px,94vw);background:rgba(2,17,32,.88);border:1px solid rgba(230,183,63,.58);border-radius:24px;padding:32px 34px;box-shadow:0 30px 100px rgba(0,0,0,.70),0 0 40px rgba(48,145,220,.13);backdrop-filter:blur(14px)}
.shield{width:80px;height:80px;margin:0 auto 12px;border:1px solid #6ca9d7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;background:radial-gradient(circle,#163a5e,#07192b);box-shadow:0 0 26px rgba(82,171,235,.32)}
.eyebrow{text-align:center;color:#e6b73f;letter-spacing:4px;font-size:13px;font-weight:bold}
h1{text-align:center;margin:8px 0 4px;font-size:32px;letter-spacing:2px}
.subtitle{text-align:center;color:#d7e4ee;font-size:16px;margin-bottom:20px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#e6b73f,transparent);margin:16px 0 8px}
label{display:block;color:#e6b73f;font-weight:bold;margin:16px 0 6px;font-size:15px;letter-spacing:.4px}
.passwrap{position:relative}
.passwrap input{padding-right:80px}
input{width:100%;padding:13px 15px;border:1px solid #466d8a;border-radius:10px;background:rgba(1,14,28,.90);color:#fff;font-family:inherit;font-size:17px;outline:none}
input:focus{border-color:#e6b73f;box-shadow:0 0 0 3px rgba(230,183,63,.10)}
.showbtn{position:absolute;right:7px;top:7px;width:auto;margin:0;padding:7px 10px;background:#0b2947;color:#d9e9f5;border:1px solid #365d7c;border-radius:7px;font-family:inherit;cursor:pointer;font-size:13px}
.submitbtn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(180deg,#f2c857,#d69f25);color:#091423;font-family:inherit;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 9px 28px rgba(216,160,37,.25)}
.submitbtn:hover{filter:brightness(1.07)}
.flash-error{background:rgba(123,37,48,.90);border:1px solid #c56270;padding:11px 12px;border-radius:9px;margin:12px 0;color:#fff}
.flash-success{background:rgba(20,80,40,.90);border:1px solid #4caf70;padding:11px 12px;border-radius:9px;margin:12px 0;color:#fff}
.hint{font-size:12px;color:#7f9caf;margin-top:5px}
.back-link{display:block;text-align:center;margin-top:18px;color:#e6b73f;font-size:14px;text-decoration:none;opacity:.85}
.back-link:hover{opacity:1;text-decoration:underline}
</style>
</head>
<body>
<div class="overlay">
  <main class="portal">
    <div class="shield">🔐</div>
    <div class="eyebrow">ACCOUNT RECOVERY</div>
    <h1>GAUR PORTAL</h1>
    <div class="subtitle">Set New Password</div>
    <div class="rule"></div>

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
        <div class="flash-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" autocomplete="off">
      <label>NEW PASSWORD</label>
      <div class="passwrap">
        <input id="pw1" name="password" type="password" required placeholder="Enter new password" minlength="6">
        <button type="button" class="showbtn" id="showBtn">SHOW</button>
      </div>
      <div class="hint">Minimum 6 characters</div>

      <label>CONFIRM PASSWORD</label>
      <div class="passwrap">
        <input id="pw2" name="confirm_password" type="password" required placeholder="Re-enter new password">
      </div>

      <button class="submitbtn" type="submit">✅ UPDATE PASSWORD</button>
    </form>

    <a class="back-link" href="/">← Back to Login</a>
  </main>
</div>
<script>
const btn=document.getElementById('showBtn');
const p1=document.getElementById('pw1');
const p2=document.getElementById('pw2');
btn.addEventListener('click',()=>{
  const h=p1.type==='password';
  p1.type=h?'text':'password';
  p2.type=h?'text':'password';
  btn.textContent=h?'HIDE':'SHOW';
});
</script>
</body>
</html>
