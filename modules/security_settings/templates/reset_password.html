<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password • THE GAUR</title>
<style>body{margin:0;background:#061829;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.box{width:min(480px,92vw);background:#0c2d49;border:1px solid #e6b73f;border-radius:18px;padding:26px;box-shadow:0 20px 55px #0008}h1{color:#e6b73f;margin-top:0}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #416887;background:#071e32;color:#fff;margin:5px 0 12px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#e6b73f;font-weight:900;cursor:pointer}.flash{padding:10px;border-radius:9px;margin:10px 0;background:#243f50}a{color:#e6b73f}</style></head>
<body><div class="box"><h1>OTP Password Reset</h1>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>Login ID</label><input name="login_id" value="{{login_id}}" required><label>6-digit OTP</label><input name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"><label>New Password</label><input type="password" name="new_password" minlength="8" required><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" required><button class="btn">Verify OTP & Change Password</button></form><p><a href="/security/forgot-password">Request New OTP</a> • <a href="/">Login</a></p></div></body></html>
