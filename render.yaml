services:
  - type: web
    name: gaur-immigration-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gaur-crm-db
          property: connectionString
      - key: GAUR_CRM_SECRET
        generateValue: true
      - key: CLOUD_MODE
        value: "1"
      - key: STORE_FILES_IN_DB
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: gaur-crm-db
    plan: free
    databaseName: gaur_crm
